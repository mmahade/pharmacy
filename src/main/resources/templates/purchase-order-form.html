<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <link rel="icon" type="image/png" th:href="@{/favicon/capsules.png}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Purchase Order - MediCare</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Chart.js for charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        .gradient-blue {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .card {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            transition: box-shadow 0.3s;
        }

        .sidebar-item {
            transition: all 0.2s;
        }

        .sidebar-item:hover {
            background-color: #f3f4f6;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/pharmacy-styles.css}">
</head>

<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('purchase-orders')}"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col" x-data="poForm()">
            <!-- Header -->
            <header class="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                <div class="flex h-16 items-center gap-4 px-6">
                    <div class="flex-1 flex items-center gap-4">
                        <div class="relative max-w-md w-full"></div>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="text-right mr-2 hidden sm:block">
                            <p class="text-sm font-medium" th:text="${#authentication.name}">Admin User</p>
                            <p class="text-xs text-gray-500">Administrator</p>
                        </div>

                        <div class="relative">
                            <button id="userMenuBtn" class="p-2 rounded-full hover:bg-gray-100">
                                <div class="h-8 w-8 rounded-full gradient-blue flex items-center justify-center text-white font-medium text-sm"
                                    th:text="${#strings.substring(#authentication.name, 0, 1)}">A</div>
                            </button>
                            <div id="userMenu"
                                class="hidden absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-gray-200">
                                <div class="p-2">
                                    <div class="px-3 py-2 text-sm font-medium border-b border-gray-100">My Account</div>
                                    <a href="/profile"
                                        class="block px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded">Profile
                                        Settings</a>
                                    <div class="border-t border-gray-100 mt-2 pt-2">
                                        <form th:action="@{/logout}" method="post">
                                            <button type="submit"
                                                class="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded">Log
                                                out</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="flex-1 overflow-auto p-6 space-y-6">
                <!-- Page Header -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <a href="/purchase-orders" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                            <i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i>
                        </a>
                        <div>
                            <h1 class="text-3xl font-bold text-gray-900">Create Purchase Order</h1>
                            <p class="mt-1 text-gray-600">Add new purchase order details</p>
                        </div>
                    </div>
                </div>

                <form th:action="@{/purchase-orders}" method="post" id="poForm" class="space-y-6">
                    <!-- Supplier & Info -->
                    <div class="card p-6 border border-gray-200">
                        <h2 class="text-xl font-bold text-gray-900 mb-6">Supplier Information</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="relative" x-data="{ 
                                    open: false, 
                                    search: '', 
                                    list: [],
                                    loading: false,
                                    async fetchSuppliers() {
                                        if (this.search.length < 2) {
                                            this.list = [];
                                            return;
                                        }
                                        this.loading = true;
                                        try {
                                            const response = await fetch(`/api/suppliers/search?q=${encodeURIComponent(this.search)}`);
                                            if (response.ok) {
                                                this.list = await response.json();
                                            }
                                        } catch (e) { console.error(e); }
                                        finally { this.loading = false; }
                                    }
                                }">
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    Supplier <span class="text-red-500">*</span>
                                </label>
                                <input type="hidden" name="supplierId" :value="formData.supplierId" required>
                                <div class="relative">
                                    <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                                    <input type="text" 
                                        x-model="search"
                                        @input.debounce.300ms="fetchSuppliers()"
                                        @focus="open = true"
                                        @click.away="open = false"
                                        placeholder="Search for a supplier..."
                                        class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    
                                    <div x-show="loading" class="absolute right-3 top-1/2 -translate-y-1/2">
                                        <div class="w-4 h-4 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                                    </div>
                                </div>
                                <div x-show="open && (list.length > 0 || loading)" x-cloak class="absolute z-50 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-60 overflow-y-auto">
                                    <template x-for="supplier in list" :key="supplier.id">
                                        <div @click="formData.supplierId = supplier.id; search = supplier.name; open = false"
                                            class="px-4 py-2 hover:bg-blue-50 cursor-pointer text-sm">
                                            <span x-text="supplier.name"></span>
                                        </div>
                                    </template>
                                    <div x-show="!loading && search.length >= 2 && list.length === 0" class="px-4 py-2 text-sm text-gray-500 italic">
                                        No suppliers found...
                                    </div>
                                </div>
                            </div>
                            <div>
                                <label for="orderDate" class="block text-sm font-medium text-gray-700 mb-2">
                                    Order Date <span class="text-red-500">*</span>
                                </label>
                                <input type="date" id="orderDate" name="orderDate" x-model="formData.orderDate" required
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
                            </div>
                        </div>
                    </div>

                    <!-- Order Items -->
                    <div class="card p-6 border border-gray-200">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-xl font-bold text-gray-900">Order Items</h2>
                            <button type="button" onclick="addItemRow()"
                                class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                                Add Item
                            </button>
                        </div>

                        <div id="itemsContainer" class="space-y-4">
                            <!-- Alpine Item Rows -->
                            <template x-for="(item, index) in formData.items" :key="index">
                                <div class="item-row grid grid-cols-1 md:grid-cols-12 gap-4 p-4 bg-gray-50 rounded-lg relative"
                                    :data-index="index">
                                    <div class="md:col-span-5 relative" x-data="{ 
                                            open: false, 
                                            search: '', 
                                            list: [], 
                                            loading: false,
                                            async fetchMedicines() {
                                                if (this.search.length < 2) {
                                                    this.list = [];
                                                    return;
                                                }
                                                this.loading = true;
                                                try {
                                                    const response = await fetch(`/api/medicines/search?q=${encodeURIComponent(this.search)}`);
                                                    if (response.ok) {
                                                        this.list = await response.json();
                                                    }
                                                } catch (e) { console.error(e); }
                                                finally { this.loading = false; }
                                            }
                                        }">
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Medication</label>
                                        <input type="hidden" :name="`items[${index}].medicineId`" :value="item.medicineId" required>
                                        <div class="relative">
                                            <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                                            <input type="text" 
                                                x-model="search"
                                                @input.debounce.300ms="fetchMedicines()"
                                                @focus="open = true"
                                                @click.away="open = false"
                                                placeholder="Search medication..."
                                                class="w-full pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                            
                                            <div x-show="loading" class="absolute right-3 top-1/2 -translate-y-1/2">
                                                <div class="w-4 h-4 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                                            </div>
                                        </div>
                                        <div x-show="open && (list.length > 0 || loading)" x-cloak class="absolute z-50 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-60 overflow-y-auto p-1">
                                            <template x-for="med in list" :key="med.id">
                                                <div @click="item.medicineId = med.id; search = med.name; open = false; if(med.price) item.price = med.price"
                                                    class="px-4 py-2 hover:bg-blue-50 cursor-pointer text-sm rounded-md group">
                                                    <div class="flex items-center justify-between">
                                                        <span x-text="med.name" class="font-medium text-gray-900"></span>
                                                        <i data-lucide="plus-circle" class="w-4 h-4 text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                                                    </div>
                                                </div>
                                            </template>
                                            <div x-show="!loading && search.length >= 2 && list.length === 0" class="px-4 py-2 text-sm text-gray-500 italic">
                                                No medications found...
                                            </div>
                                        </div>
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Quantity</label>
                                        <input type="number" :name="`items[${index}].quantityOrdered`" x-model.number="item.quantity" required min="1"
                                            class="qty-input w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            placeholder="0" />
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Unit Price ($)</label>
                                        <input type="number" :name="`items[${index}].unitCostPrice`" x-model.number="item.price" required min="0" step="0.01"
                                            class="price-input w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            placeholder="0.00" />
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Total</label>
                                        <div
                                            class="row-total px-4 py-2.5 bg-gray-100 border border-gray-300 rounded-lg font-medium text-gray-900"
                                            x-text="'$' + (item.quantity * item.price).toFixed(2)">
                                            $0.00
                                        </div>
                                    </div>
                                    <div class="md:col-span-1 flex items-end">
                                        <button type="button" @click="removeItem(index)" :disabled="formData.items.length === 1"
                                            class="remove-btn p-2.5 text-red-600 hover:bg-red-50 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <div class="mt-6 pt-6 border-t border-gray-200">
                            <div class="flex justify-between items-center">
                                <span class="text-lg font-semibold text-gray-900">Gross Total:</span>
                                <span id="grandTotal" class="text-2xl font-bold text-gray-900" 
                                    x-text="'$' + formData.items.reduce((sum, item) => sum + (item.quantity * item.price), 0).toFixed(2)">$0.00</span>
                            </div>
                        </div>
                    </div>

                    <!-- Additional Notes -->
                    <div class="card p-6 border border-gray-200">
                        <h2 class="text-xl font-bold text-gray-900 mb-6">Additional Information</h2>
                        <div>
                            <label for="notes" class="block text-sm font-medium text-gray-700 mb-2">Notes</label>
                            <textarea id="notes" name="notes" rows="4"
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                placeholder="Add any additional notes or special instructions..."></textarea>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center justify-end gap-3 card p-6 border border-gray-200">
                        <a href="/purchase-orders"
                            class="px-6 py-2.5 border border-gray-300 bg-white rounded-lg hover:bg-gray-50 transition-colors font-medium text-gray-700">
                            Cancel
                        </a>
                        <button type="submit"
                            class="inline-flex items-center gap-2 px-6 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
                            <i data-lucide="save" class="w-5 h-5"></i>
                            Create Order
                        </button>
                    </div>
                </form>

                <!-- Page Information Footer -->
                <div class="mt-8 bg-white/50 border-t border-slate-200">
                    <div th:replace="~{fragments/footer :: footer}"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Script Block for handling dynamic items -->
    <script th:inline="javascript">
        // Initialize Lucide icons
        lucide.createIcons();

        function poForm() {
            return {
                formData: {
                    supplierId: '',
                    orderDate: new Date().toISOString().split('T')[0],
                    notes: '',
                    items: [
                        { medicineId: '', quantity: 0, price: 0 }
                    ]
                },
                init() {
                    // Lucide icons need re-init after Alpine renders
                    this.$watch('formData.items', () => {
                        this.$nextTick(() => lucide.createIcons());
                    });
                },
                addItem() {
                    this.formData.items.push({ medicineId: '', quantity: 0, price: 0 });
                },
                removeItem(index) {
                    if (this.formData.items.length > 1) {
                        this.formData.items.splice(index, 1);
                    }
                }
            }
        }

        // User menu toggle
        const userMenuBtn = document.getElementById('userMenuBtn');
        const userMenu = document.getElementById('userMenu');

        if (userMenuBtn && userMenu) {
            userMenuBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                userMenu.classList.toggle('hidden');
            });

            document.addEventListener('click', function (event) {
                if (!userMenu.contains(event.target) && !userMenuBtn.contains(event.target)) {
                    userMenu.classList.add('hidden');
                }
            });
        }
    </script>
    </script>
</body>

</html>
