<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <link rel="icon" type="image/png" th:href="@{/favicon/capsules.png}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Purchase Return - MediCare</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        .gradient-blue {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .card {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            transition: box-shadow 0.3s;
        }

        .sidebar-item {
            transition: all 0.2s;
        }

        .sidebar-item:hover {
            background-color: #f3f4f6;
        }

        .sidebar-item.active {
            background-color: #eff6ff;
            color: #1d4ed8;
        }

        .input-focus:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900" x-data="returnForm()">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('purchase-returns')}"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <!-- Header -->
            <header class="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                <div class="flex h-16 items-center gap-4 px-6">
                    <div class="flex-1 flex items-center gap-4">
                        <div class="relative max-w-md w-full"></div>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="text-right mr-2 hidden sm:block">
                            <p class="text-sm font-medium" th:text="${#authentication.name}">Admin User</p>
                            <p class="text-xs text-gray-500">Administrator</p>
                        </div>

                        <div class="relative">
                            <button id="userMenuBtn" class="p-2 rounded-full hover:bg-gray-100">
                                <div class="h-8 w-8 rounded-full gradient-blue flex items-center justify-center text-white font-medium text-sm"
                                    th:text="${#strings.substring(#authentication.name, 0, 1)}">A</div>
                            </button>
                            <div id="userMenu"
                                class="hidden absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-gray-200">
                                <div class="p-2">
                                    <div class="px-3 py-2 text-sm font-medium border-b border-gray-100">My Account</div>
                                    <a href="/profile"
                                        class="block px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded">Profile
                                        Settings</a>
                                    <div class="border-t border-gray-100 mt-2 pt-2">
                                        <form th:action="@{/logout}" method="post">
                                            <button type="submit"
                                                class="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded">Log
                                                out</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="flex-1 overflow-auto p-6 space-y-6">
                <!-- Page Header -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <a href="/purchase-returns"
                            class="p-2 hover:bg-gray-100 rounded-lg transition-colors text-gray-600">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </a>
                        <div>
                            <h1 class="text-3xl font-bold text-gray-900">Record Purchase Return</h1>
                            <p class="mt-1 text-gray-600">Create a new return record and adjust stock levels</p>
                        </div>
                    </div>
                </div>

                <form @submit.prevent="submitForm" class="space-y-6">
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

                        <!-- Left: Form Fields -->
                        <div class="lg:col-span-8 space-y-6">

                            <!-- Supplier Information -->
                            <div class="card p-6 border border-gray-200">
                                <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                                    <i data-lucide="truck" class="w-5 h-5 text-blue-600"></i>
                                    Supplier Information
                                </h2>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="space-y-2">
                                        <label class="block text-sm font-medium text-gray-700">Supplier <span
                                                class="text-red-500">*</span></label>
                                        <select x-model="formData.supplierId" required
                                            class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                            <option value="">Select a supplier</option>
                                            <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="space-y-2">
                                        <label class="block text-sm font-medium text-gray-700">Return Date <span
                                                class="text-red-500">*</span></label>
                                        <input type="date" x-model="formData.returnDate" required
                                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                    </div>
                                    <div class="md:col-span-2 space-y-2">
                                        <label class="block text-sm font-medium text-gray-700">Reason for Return</label>
                                        <textarea x-model="formData.reason" rows="3"
                                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-gray-400"
                                            placeholder="Enter reason for return (e.g., Expired, Damaged, Wrong delivery)..."></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- Return Items -->
                            <div class="card p-6 border border-gray-200">
                                <div class="flex items-center justify-between mb-6">
                                    <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                                        <i data-lucide="package" class="w-5 h-5 text-emerald-600"></i>
                                        Return Items
                                    </h2>
                                    <button type="button" @click="addItem"
                                        class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium text-sm">
                                        <i data-lucide="plus" class="w-4 h-4"></i>
                                        Add Item
                                    </button>
                                </div>

                                <div class="space-y-4">
                                    <template x-for="(item, index) in formData.items" :key="index">
                                        <div
                                            class="item-row grid grid-cols-1 md:grid-cols-12 gap-4 p-4 bg-gray-50 rounded-lg relative">
                                            <!-- Medicine -->
                                            <div class="md:col-span-3">
                                                <label
                                                    class="block text-sm font-medium text-gray-700 mb-2">Medication</label>
                                                <select x-model="item.medicineId" @change="onMedicineChange(index)"
                                                    required
                                                    class="medicine-select w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                                    <option value="" disabled selected>Select medication</option>
                                                    <option th:each="m : ${medicines}" th:value="${m.id}"
                                                        th:data-price="${m.price}"
                                                        th:text="|${m.name} (${m.genericName})|"></option>
                                                </select>
                                            </div>

                                            <!-- Batch Selection -->
                                            <div class="md:col-span-2">
                                                <label class="block text-sm font-medium text-gray-700 mb-2">Batch /
                                                    Expiry</label>
                                                <div class="relative">
                                                    <select x-model="item.batchId" @change="onBatchChange(index)"
                                                        required :disabled="!item.medicineId || item.batchesLoading"
                                                        class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100">
                                                        <option value="">Select Expiry</option>
                                                        <template x-for="batch in item.availableBatches"
                                                            :key="batch.id">
                                                            <option :value="batch.id"
                                                                x-text="batch.batchNumber + (batch.expiryDate ? ' (Exp: ' + batch.expiryDate + ')' : '') + ' - Stock: ' + batch.quantity">
                                                            </option>
                                                        </template>
                                                    </select>
                                                    <div x-show="item.batchesLoading"
                                                        class="absolute right-10 top-1/2 -translate-y-1/2">
                                                        <div
                                                            class="w-4 h-4 border-2 border-blue-600 border-t-transparent rounded-full animate-spin">
                                                        </div>
                                                    </div>
                                                </div>
                                                <div x-show="item.batchId" class="mt-1">
                                                    <span class="text-[11px] font-medium text-blue-600">
                                                        Available: <span x-text="item.availableStock || 0"></span>
                                                    </span>
                                                </div>
                                            </div>

                                            <!-- Quantity -->
                                            <div class="md:col-span-2">
                                                <label
                                                    class="block text-sm font-medium text-gray-700 mb-2">Quantity</label>
                                                <input type="number" x-model.number="item.quantity" min="1"
                                                    :max="item.availableStock" required
                                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                            </div>

                                            <!-- Price -->
                                            <div class="md:col-span-2">
                                                <label
                                                    class="block text-sm font-medium text-gray-700 mb-2 truncate">Price
                                                    ($)</label>
                                                <input type="number" x-model.number="item.unitPrice" step="0.01" min="0"
                                                    required
                                                    class="w-full px-2 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
                                            </div>

                                            <!-- Total -->
                                            <div class="md:col-span-2">
                                                <label
                                                    class="block text-sm font-medium text-gray-700 mb-2">Total</label>
                                                <div class="px-3 py-2.5 bg-gray-100 border border-gray-300 rounded-lg font-medium text-gray-900 text-sm h-[46px] flex items-center justify-center truncate"
                                                    x-text="'$' + (item.quantity * item.unitPrice).toFixed(2)">
                                                    $0.00
                                                </div>
                                            </div>

                                            <!-- Remove -->
                                            <div class="md:col-span-1 flex items-end justify-center">
                                                <button type="button" @click="removeItem(index)"
                                                    x-show="formData.items.length > 1"
                                                    class="p-2.5 text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                                                    title="Remove Item">
                                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- Right: Totals Summary -->
                        <div class="lg:col-span-4 space-y-6">
                            <div class="card p-6 border border-gray-200 sticky top-24 overflow-hidden">
                                <h3 class="text-xl font-bold text-gray-900 mb-6">Return Summary</h3>

                                <div class="space-y-4">
                                    <div class="flex justify-between items-center text-sm">
                                        <span class="text-gray-500">Total Items</span>
                                        <span class="font-bold text-gray-900" x-text="formData.items.length">0</span>
                                    </div>
                                    <div class="flex justify-between items-center text-sm">
                                        <span class="text-gray-500">Gross Quantity</span>
                                        <span class="font-bold text-gray-900" x-text="totalQuantity()">0</span>
                                    </div>

                                    <div class="border-t border-gray-100 pt-4 mt-4">
                                        <div class="flex flex-col gap-1">
                                            <span
                                                class="text-sm font-semibold text-gray-400 uppercase tracking-tight">Refund/Credit
                                                Amount</span>
                                            <span class="text-4xl font-extrabold text-blue-600"
                                                x-text="'$' + totalAmount().toFixed(2)">$0.00</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="mt-8 space-y-3">
                                    <button type="submit" :disabled="loading || totalAmount() === 0"
                                        class="w-full py-3.5 bg-blue-600 text-white rounded-lg font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 hover:shadow-blue-300 active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:shadow-none disabled:active:scale-100">
                                        <template x-if="!loading">
                                            <div class="flex items-center gap-2">
                                                <i data-lucide="check-circle" class="w-5 h-5"></i>
                                                <span>Save Return Record</span>
                                            </div>
                                        </template>
                                        <template x-if="loading">
                                            <div class="flex items-center gap-2">
                                                <div
                                                    class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin">
                                                </div>
                                                <span>Processing...</span>
                                            </div>
                                        </template>
                                    </button>
                                    <a href="/purchase-returns"
                                        class="block w-full text-center py-2.5 text-sm font-bold text-gray-500 hover:text-gray-700 transition-colors uppercase tracking-widest">
                                        Cancel
                                    </a>
                                </div>
                            </div>
                        </div>

                    </div>
                </form>

                <!-- Footer -->
                <div class="mt-8 bg-white/50 border-t border-gray-200">
                    <div th:replace="~{fragments/footer :: footer}"></div>
                </div>
            </main>
        </div>
    </div>

    <script th:inline="javascript">
        function returnForm() {
            return {
                loading: false,
                formData: {
                    supplierId: '',
                    returnDate: new Date().toISOString().split('T')[0],
                    reason: '',
                    items: [
                        { medicineId: '', batchId: '', quantity: 1, unitPrice: 0.00, availableStock: 0, availableBatches: [], batchesLoading: false }
                    ]
                },
                addItem() {
                    this.formData.items.push({ medicineId: '', batchId: '', quantity: 1, unitPrice: 0.00, availableStock: 0, availableBatches: [], batchesLoading: false });
                    this.$nextTick(() => lucide.createIcons());
                },
                async onMedicineChange(index) {
                    const select = event.target;
                    const selectedOption = select.options[select.selectedIndex];
                    const item = this.formData.items[index];

                    // Reset item dependent fields
                    item.batchId = '';
                    item.availableStock = 0;
                    item.availableBatches = [];

                    if (selectedOption && selectedOption.value) {
                        item.unitPrice = parseFloat(selectedOption.getAttribute('data-price')) || 0;

                        // Fetch batches
                        item.batchesLoading = true;
                        try {
                            const response = await fetch(`/api/medicines/${item.medicineId}/batches`);
                            if (response.ok) {
                                const batches = await response.json();
                                item.availableBatches = batches.filter(b => b.quantity > 0);
                            }
                        } catch (error) {
                            console.error('Error fetching batches:', error);
                        } finally {
                            item.batchesLoading = false;
                        }
                    } else {
                        item.unitPrice = 0;
                    }
                },
                onBatchChange(index) {
                    const item = this.formData.items[index];
                    const selectedBatch = item.availableBatches.find(b => b.id == item.batchId);

                    if (selectedBatch) {
                        item.availableStock = selectedBatch.quantity;
                        // Optional: update unitPrice to cost if needed, or keep medicine default
                        // item.unitPrice = selectedBatch.unitCostPrice; 

                        if (item.quantity > item.availableStock) {
                            item.quantity = item.availableStock;
                        }
                    } else {
                        item.availableStock = 0;
                    }
                },
                removeItem(index) {
                    this.formData.items.splice(index, 1);
                },
                totalQuantity() {
                    return this.formData.items.reduce((sum, item) => sum + (parseInt(item.quantity) || 0), 0);
                },
                totalAmount() {
                    return this.formData.items.reduce((sum, item) => sum + (item.quantity * item.unitPrice || 0), 0);
                },
                async submitForm() {
                    if (this.totalAmount() === 0) return;
                    this.loading = true;
                    try {
                        const response = await fetch('/api/purchase-returns', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.content
                            },
                            body: JSON.stringify(this.formData)
                        });

                        if (response.ok) {
                            await Swal.fire({
                                icon: 'success',
                                title: 'Success!',
                                text: 'Purchase return has been recorded successfully.',
                                confirmButtonColor: '#3b82f6'
                            });
                            window.location.href = '/purchase-returns';
                        } else {
                            const error = await response.json();
                            throw new Error(error.message || 'Failed to save return');
                        }
                    } catch (error) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: error.message,
                            confirmButtonColor: '#ef4444'
                        });
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }

        // Initialize Icons & UI
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // User menu toggle
            const userMenuBtn = document.getElementById('userMenuBtn');
            const userMenu = document.getElementById('userMenu');

            if (userMenuBtn && userMenu) {
                userMenuBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    userMenu.classList.toggle('hidden');
                });

                document.addEventListener('click', function (event) {
                    if (!userMenu.contains(event.target) && !userMenuBtn.contains(event.target)) {
                        userMenu.classList.add('hidden');
                    }
                });
            }
        });
    </script>
</body>

</html>
