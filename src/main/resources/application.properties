spring.application.name=pharmacy

#For Neon DB, the username and password are typically provided in the connection string. However, you can also set them separately as shown below. Make sure to replace the default values with your actual NeonDB credentials if they differ.
#spring.datasource.url=${DB_URL:jdbc:postgresql://ep-patient-queen-aiqvgccz-pooler.c-4.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
